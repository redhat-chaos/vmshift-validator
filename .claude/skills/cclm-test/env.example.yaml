# cclm-test skill environment config — template.
#
# Copy this file to env.yaml and fill in your bastion's real values:
#   cp env.example.yaml env.yaml
#
# env.yaml is gitignored — skill.md, bug-guidelines.md, and report-guidelines.md
# reference these keys via placeholders (<BASTION_SSH>, <BASTION_REPO>, etc.)
# instead of hardcoding paths, so updating env.yaml is enough when the bastion,
# repo checkout path, or kubeconfig locations change.

bastion:
  ssh_alias: cloud29
  repo_path: /root/vmshift-validator
  source_kubeconfig: /root/blue/kubeconfig
  target_kubeconfig: /root/green/kubeconfig

namespace: vm-services
mtv_namespace: openshift-mtv
migration_profile: baremetal-l2
sync_cmd: bash sync.sh baremetal-l2

lab_name: RDU2 Scale Lab, cloud29 allocation
