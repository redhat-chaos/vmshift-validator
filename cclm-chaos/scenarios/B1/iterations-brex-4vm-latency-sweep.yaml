# B1 — br-ex latency sweep, 4 VMs per iteration (2 Fedora + 2 Windows)
# VMIM-running trigger: chaos waits for migration to reach Running phase
# 6 iterations: 1 baseline (0ms) + 5 latency levels (5/10/15/20/30ms)
# Each iteration: 2 Fedora + 2 Windows = 4 VMs. Total VMs: 24
#
# Prerequisites:
#   - VMs running on source cluster (density batch 446e62a5)
#   - Merged/IP-based kubeconfig at /root/krknctl-kc/merged-ip-kubeconfig (auto-created if missing)
#
# Usage:
#   ./chaos-sweep.sh -f iterations-brex-4vm-latency-sweep.yaml
#   ./chaos-sweep.sh -f iterations-brex-4vm-latency-sweep.yaml --dry-run
#   ./chaos-sweep.sh -f iterations-brex-4vm-latency-sweep.yaml --start-from 10ms-4vm
#
# NOTE (2026-08-10): vm-svc-446e62a5-4/-12/-13/-16 had already been migrated away
# by unrelated A-series scenario runs earlier in this session (Stopped on source).
# Substituted with fresh, unused VMs from the same density batch: -56, -57, -58, -59
# respectively, in the 0ms/15ms/20ms/30ms iterations (originally tried -42..-45, but
# those turned out to already be reserved by B2's brex loss-sweep YAML — picked
# high-numbered VMs (56+) instead since no sweep YAML references that range).
# All other VMs unchanged.

sweep_name: "brex-4vm-latency-sweep"
description: "B1 br-ex latency sweep — VMIM-running trigger, 0/5/10/15/20/30ms, 2F+2W per iteration"
date: "2026-08-07"

defaults:
  chaos_trigger: chaos-trigger.sh
  trigger_mode: vmim-running
  chaos_duration: 300
  all_workers: true
  gateway_label: "node-role.kubernetes.io/worker"
  interface: br-ex
  cooldown_s: 90
  namespace: vm-services
  source_kubeconfig: /root/blue/kubeconfig
  target_kubeconfig: /root/green/kubeconfig
  migration_profile: baremetal-l2
  migration_max_attempts: 180

iterations:

  # --- 0ms baseline (no chaos) ---
  - tag: 0ms-4vm
    name: "baseline | 0ms latency | br-ex | 2F+2W"
    latency: "0ms"
    skip_chaos: true
    interface: br-ex
    vms:
      - vm-svc-446e62a5-3
      - vm-svc-446e62a5-56
      - vm-win-446e62a5-1
      - vm-win-446e62a5-2

  # --- 5ms latency ---
  - tag: 5ms-4vm
    name: "5ms latency | br-ex | 2F+2W"
    latency: "5ms"
    interface: br-ex
    vms:
      - vm-svc-446e62a5-5
      - vm-svc-446e62a5-6
      - vm-win-446e62a5-3
      - vm-win-446e62a5-4

  # --- 10ms latency ---
  - tag: 10ms-4vm
    name: "10ms latency | br-ex | 2F+2W"
    latency: "10ms"
    interface: br-ex
    vms:
      - vm-svc-446e62a5-7
      - vm-svc-446e62a5-8
      - vm-win-446e62a5-5
      - vm-win-446e62a5-6

  # --- 15ms latency ---
  - tag: 15ms-4vm
    name: "15ms latency | br-ex | 2F+2W"
    latency: "15ms"
    interface: br-ex
    vms:
      - vm-svc-446e62a5-9
      - vm-svc-446e62a5-57
      - vm-win-446e62a5-7
      - vm-win-446e62a5-8

  # --- 20ms latency ---
  - tag: 20ms-4vm
    name: "20ms latency | br-ex | 2F+2W"
    latency: "20ms"
    interface: br-ex
    vms:
      - vm-svc-446e62a5-58
      - vm-svc-446e62a5-14
      - vm-win-446e62a5-9
      - vm-win-446e62a5-10

  # --- 30ms latency ---
  - tag: 30ms-4vm
    name: "30ms latency | br-ex | 2F+2W"
    latency: "30ms"
    interface: br-ex
    vms:
      - vm-svc-446e62a5-59
      - vm-svc-446e62a5-17
      - vm-win-446e62a5-11
      - vm-win-446e62a5-12
