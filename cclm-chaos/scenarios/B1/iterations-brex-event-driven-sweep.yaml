# B1 — br-ex latency sweep with event-driven chaos-trigger
# VMIM-running trigger: chaos polls for VMIM Running, then injects via direct tc/netem
# 6 iterations: 1 baseline (0ms) + 5 latency levels (5/10/20/30/40ms)
# 1 Fedora VM per iteration, 6 total
#
# Prerequisites:
#   - VMs running on source cluster (density batch 730cf297)
#   - No merged kubeconfig needed (event-driven script uses separate kubeconfigs)
#
# Usage:
#   ./chaos-sweep.sh -f iterations-brex-event-driven-sweep.yaml
#   ./chaos-sweep.sh -f iterations-brex-event-driven-sweep.yaml --dry-run
#   ./chaos-sweep.sh -f iterations-brex-event-driven-sweep.yaml --start-from 20ms-1vm

sweep_name: "brex-event-driven-sweep"
description: "B1 br-ex latency sweep — event-driven trigger (direct tc), 0/5/10/20/30/40ms, 1 Fedora VM each"
date: "2026-07-24"

defaults:
  chaos_trigger: chaos-trigger.sh
  trigger_mode: vmim-running
  chaos_duration: 300
  all_workers: true
  gateway_label: "node-role.kubernetes.io/worker"
  cooldown_s: 60
  namespace: vm-services
  source_kubeconfig: /root/blue/kubeconfig
  target_kubeconfig: /root/green/kubeconfig
  migration_profile: baremetal-l2
  migration_max_attempts: 120

iterations:

  # --- 0ms baseline (no chaos) ---
  - tag: baseline-0ms-1vm
    name: "baseline | no chaos | 1 Fedora VM"
    latency: "0ms"
    skip_chaos: true
    interface: br-ex
    vms:
      - vm-svc-730cf297-2

  # --- 5ms latency ---
  - tag: 5ms-1vm
    name: "5ms latency | br-ex | 1 Fedora VM"
    latency: "5ms"
    interface: br-ex
    vms:
      - vm-svc-730cf297-3

  # --- 10ms latency ---
  - tag: 10ms-1vm
    name: "10ms latency | br-ex | 1 Fedora VM"
    latency: "10ms"
    interface: br-ex
    vms:
      - vm-svc-730cf297-4

  # --- 20ms latency ---
  - tag: 20ms-1vm
    name: "20ms latency | br-ex | 1 Fedora VM"
    latency: "20ms"
    interface: br-ex
    vms:
      - vm-svc-730cf297-5

  # --- 30ms latency ---
  - tag: 30ms-1vm
    name: "30ms latency | br-ex | 1 Fedora VM"
    latency: "30ms"
    interface: br-ex
    vms:
      - vm-svc-730cf297-6

  # --- 40ms latency ---
  - tag: 40ms-1vm
    name: "40ms latency | br-ex | 1 Fedora VM"
    latency: "40ms"
    interface: br-ex
    vms:
      - vm-svc-730cf297-7
