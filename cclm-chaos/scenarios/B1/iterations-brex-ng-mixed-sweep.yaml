# B1 — br-ex latency sweep with node-network-chaos (ng)
# VMIM-running trigger: chaos waits for migration to reach Running phase
# 7 iterations: 2 smoke + 5 sweep levels (0, 10, 30, 50, 100ms)
# Each sweep iteration: 3 Fedora + 2 Windows = 5 VMs
# Total VMs: 2 (smoke) + 25 (sweep) = 27
#
# Prerequisites:
#   - 60 Fedora + 20 Windows VMs running on source (density batch 04214604)
#   - Merged kubeconfig at /root/merged-kubeconfig (auto-created if missing)
#   - node-network-chaos image with PR #1501 fix (quay.io/krkn-chaos/krkn-hub:node-network-chaos)
#   - VMs 1–18 (+ win 1–10) reserved for B2; this sweep uses 19+ / win 11+

sweep_name: "brex-ng-mixed-sweep"
description: "B1 br-ex latency sweep — node-network-chaos (ng), VMIM-running trigger, 0/10/30/50/100ms, 3F+2W"
date: "2026-07-23"

defaults:
  chaos_trigger: chaos-trigger.sh
  trigger_mode: vmim-running
  chaos_duration: 300
  all_workers: true
  gateway_label: "node-role.kubernetes.io/worker"
  cooldown_s: 90
  namespace: vm-services
  source_kubeconfig: /root/blue/kubeconfig
  target_kubeconfig: /root/green/kubeconfig
  migration_profile: baremetal-l2
  migration_max_attempts: 180

vm_pool:
  fedora_prefix: "vm-svc-04214604"
  windows_prefix: "vm-win-04214604"

iterations:

  # --- Single VM smoke test ---
  - tag: smoke-50ms-brex-1vm
    name: "smoke | 50ms latency | br-ex | 1 Fedora VM"
    latency: "50ms"
    chaos_duration: 180
    interface: br-ex
    vms:
      - vm-svc-04214604-19

  # --- Single VM 100ms stress test ---
  - tag: smoke-100ms-brex-1vm
    name: "smoke | 100ms latency | br-ex | 1 Fedora VM"
    latency: "100ms"
    chaos_duration: 300
    interface: br-ex
    vms:
      - vm-svc-04214604-20

  # --- 0ms baseline (no chaos) ---
  - tag: 0ms-brex-mixed-5vm
    name: "baseline | 0ms latency | br-ex | 3F+2W"
    latency: "0ms"
    skip_chaos: true
    interface: br-ex
    vms:
      - vm-svc-04214604-21
      - vm-svc-04214604-22
      - vm-svc-04214604-23
      - vm-win-04214604-11
      - vm-win-04214604-12

  # --- 10ms latency ---
  - tag: 10ms-brex-mixed-5vm
    name: "10ms latency | br-ex | 3F+2W"
    latency: "10ms"
    interface: br-ex
    vms:
      - vm-svc-04214604-24
      - vm-svc-04214604-25
      - vm-svc-04214604-26
      - vm-win-04214604-13
      - vm-win-04214604-14

  # --- 30ms latency ---
  - tag: 30ms-brex-mixed-5vm
    name: "30ms latency | br-ex | 3F+2W"
    latency: "30ms"
    interface: br-ex
    vms:
      - vm-svc-04214604-27
      - vm-svc-04214604-28
      - vm-svc-04214604-29
      - vm-win-04214604-15
      - vm-win-04214604-16

  # --- 50ms latency ---
  - tag: 50ms-brex-mixed-5vm
    name: "50ms latency | br-ex | 3F+2W"
    latency: "50ms"
    interface: br-ex
    vms:
      - vm-svc-04214604-30
      - vm-svc-04214604-31
      - vm-svc-04214604-32
      - vm-win-04214604-17
      - vm-win-04214604-18

  # --- 100ms latency ---
  - tag: 100ms-brex-mixed-5vm
    name: "100ms latency | br-ex | 3F+2W"
    latency: "100ms"
    chaos_duration: 420
    interface: br-ex
    vms:
      - vm-svc-04214604-33
      - vm-svc-04214604-34
      - vm-svc-04214604-35
      - vm-win-04214604-19
      - vm-win-04214604-20
