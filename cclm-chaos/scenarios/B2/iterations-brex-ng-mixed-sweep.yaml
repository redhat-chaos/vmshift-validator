# B2 — br-ex packet loss sweep with node-network-chaos (ng)
# VMIM-running trigger: chaos waits for migration to reach Running phase
# 6 iterations: 1 smoke + 5 sweep levels (0%, 5%, 10%, 15%, 20%)
# Each sweep iteration: 3 Fedora + 2 Windows = 5 VMs
# Total VMs: 1 (smoke) + 25 (sweep) = 26
#
# Prerequisites:
#   - 60 Fedora + 20 Windows VMs running on source (density batch 04214604)
#   - Merged kubeconfig at /root/merged-kubeconfig (auto-created if missing)
#   - node-network-chaos image with PR #1501 fix (quay.io/krkn-chaos/krkn-hub:node-network-chaos)

sweep_name: "brex-ng-mixed-sweep"
description: "B2 br-ex packet loss sweep — node-network-chaos (ng), VMIM-running trigger, 0/5/10/15/20% loss, 3F+2W"
date: "2026-07-23"

defaults:
  chaos_trigger: chaos-trigger.sh
  trigger_mode: vmim-running
  chaos_duration: 300
  all_workers: true
  gateway_label: "node-role.kubernetes.io/worker"
  cooldown_s: 90
  namespace: vm-services
  source_kubeconfig: /root/blue/kubeconfig
  target_kubeconfig: /root/green/kubeconfig
  migration_profile: baremetal-l2
  migration_max_attempts: 180

vm_pool:
  fedora_prefix: "vm-svc-04214604"
  windows_prefix: "vm-win-04214604"

iterations:

  # --- Single VM smoke test ---
  - tag: smoke-5pct-brex-1vm
    name: "smoke | 5% loss | br-ex | 1 Fedora VM"
    loss_percent: 5
    chaos_duration: 180
    interface: br-ex
    vms:
      - vm-svc-04214604-17

  # --- Single VM 30% stress test ---
  - tag: smoke-30pct-brex-1vm
    name: "smoke | 30% loss | br-ex | 1 Fedora VM"
    loss_percent: 30
    chaos_duration: 300
    interface: br-ex
    vms:
      - vm-svc-04214604-18

  # --- 0% baseline (no chaos) ---
  - tag: 0pct-brex-mixed-5vm
    name: "baseline | 0% loss | br-ex | 3F+2W"
    loss_percent: 0
    skip_chaos: true
    interface: br-ex
    vms:
      - vm-svc-04214604-2
      - vm-svc-04214604-3
      - vm-svc-04214604-4
      - vm-win-04214604-1
      - vm-win-04214604-2

  # --- 5% loss ---
  - tag: 5pct-brex-mixed-5vm
    name: "5% loss | br-ex | 3F+2W"
    loss_percent: 5
    interface: br-ex
    vms:
      - vm-svc-04214604-5
      - vm-svc-04214604-6
      - vm-svc-04214604-7
      - vm-win-04214604-3
      - vm-win-04214604-4

  # --- 10% loss ---
  - tag: 10pct-brex-mixed-5vm
    name: "10% loss | br-ex | 3F+2W"
    loss_percent: 10
    interface: br-ex
    vms:
      - vm-svc-04214604-8
      - vm-svc-04214604-9
      - vm-svc-04214604-10
      - vm-win-04214604-5
      - vm-win-04214604-6

  # --- 15% loss ---
  - tag: 15pct-brex-mixed-5vm
    name: "15% loss | br-ex | 3F+2W"
    loss_percent: 15
    interface: br-ex
    vms:
      - vm-svc-04214604-11
      - vm-svc-04214604-12
      - vm-svc-04214604-13
      - vm-win-04214604-7
      - vm-win-04214604-8

  # --- 20% loss ---
  - tag: 20pct-brex-mixed-5vm
    name: "20% loss | br-ex | 3F+2W"
    loss_percent: 20
    interface: br-ex
    vms:
      - vm-svc-04214604-14
      - vm-svc-04214604-15
      - vm-svc-04214604-16
      - vm-win-04214604-9
      - vm-win-04214604-10

  # --- 30% loss ---
  - tag: 30pct-brex-mixed-5vm
    name: "30% loss | br-ex | 3F+2W"
    loss_percent: 30
    interface: br-ex
    vms:
      - vm-svc-04214604-19
      - vm-svc-04214604-20
      - vm-svc-04214604-21
      - vm-win-04214604-11
      - vm-win-04214604-12

  # --- 40% loss ---
  - tag: 40pct-brex-mixed-5vm
    name: "40% loss | br-ex | 3F+2W"
    loss_percent: 40
    interface: br-ex
    vms:
      - vm-svc-04214604-22
      - vm-svc-04214604-23
      - vm-svc-04214604-24
      - vm-win-04214604-13
      - vm-win-04214604-14
