# B2 — br-migration 5% packet loss round 2 with node-network-chaos (ng)
# VMIM-running trigger, 3 Fedora + 2 Windows = 5 VMs
# Second run to validate reproducibility of r1 findings

sweep_name: "brmig-ng-5pct-r2"
description: "B2 br-migration 5% packet loss round 2 — node-network-chaos (ng), VMIM-running trigger, 3F+2W"
date: "2026-07-24"

defaults:
  chaos_trigger: chaos-trigger.sh
  trigger_mode: vmim-running
  chaos_duration: 600
  all_workers: true
  gateway_label: "node-role.kubernetes.io/worker"
  cooldown_s: 90
  namespace: vm-services
  source_kubeconfig: /root/blue/kubeconfig
  target_kubeconfig: /root/green/kubeconfig
  migration_profile: baremetal-l2
  migration_max_attempts: 180

iterations:

  - tag: 5pct-brmig-mixed-5vm-r2
    name: "5% loss | br-migration | 3F+2W (round 2)"
    loss_percent: 5
    interface: br-migration
    vms:
      - vm-svc-04214604-28
      - vm-svc-04214604-29
      - vm-svc-04214604-30
      - vm-win-04214604-17
      - vm-win-04214604-18
