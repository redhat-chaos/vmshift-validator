# B2 — br-migration 5% packet loss with node-network-chaos (ng)
# VMIM-running trigger: chaos waits for migration to reach Running phase
# 1 iteration: 3 Fedora + 2 Windows = 5 VMs
#
# Prerequisites:
#   - VMs running on source (density batch 04214604)
#   - Merged kubeconfig at /root/merged-kubeconfig
#   - node-network-chaos image pulled

sweep_name: "brmig-ng-5pct"
description: "B2 br-migration 5% packet loss — node-network-chaos (ng), VMIM-running trigger, 3F+2W"
date: "2026-07-24"

defaults:
  chaos_trigger: chaos-trigger.sh
  trigger_mode: vmim-running
  chaos_duration: 300
  all_workers: true
  gateway_label: "node-role.kubernetes.io/worker"
  cooldown_s: 90
  namespace: vm-services
  source_kubeconfig: /root/blue/kubeconfig
  target_kubeconfig: /root/green/kubeconfig
  migration_profile: baremetal-l2
  migration_max_attempts: 180

iterations:

  - tag: 5pct-brmig-mixed-5vm
    name: "5% loss | br-migration | 3F+2W"
    loss_percent: 5
    interface: br-migration
    vms:
      - vm-svc-04214604-25
      - vm-svc-04214604-26
      - vm-svc-04214604-27
      - vm-win-04214604-15
      - vm-win-04214604-16
